<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>壁龛定制 - 3D模型</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #f0f0f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.92);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 10;
            max-width: 280px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        #info h2 { font-size: 15px; margin-bottom: 8px; color: #222; }
        #info p { margin: 3px 0; color: #555; line-height: 1.5; }
        #info .red { color: #e74c3c; font-weight: 500; }
        #three-container { width: 100vw; height: 100vh; }
        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #666;
            z-index: 5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="loading">加载中...</div>
    <div id="info">
        <h2>壁龛定制 3D模型</h2>
        <p>触摸旋转 · 双指缩放</p>
        <div id="params-display"></div>
    </div>
    <div id="three-container"></div>

    <script src="js/three-viewer.js"></script>
    <script>
        function parseParams() {
            const p = new URLSearchParams(location.search);
            const layers = parseInt(p.get('l')) || 3;
            const totalHeight = parseInt(p.get('h')) || 880;
            const thickness = parseInt(p.get('t')) || 10;

            // viewer.html 自行均分每层高度
            const remaining = totalHeight - thickness * (layers - 1);
            const avg = Math.floor(remaining / layers);
            let layerHeights = Array(layers).fill(avg);
            const sum = avg * layers;
            layerHeights[layers - 1] += remaining - sum;

            const width = parseInt(p.get('w')) || 260;
            const depth = parseInt(p.get('d')) || 250;
            const topFold = parseInt(p.get('ft')) || 10;
            const bottomFold = parseInt(p.get('fb')) || 10;
            const leftFold = parseInt(p.get('fl')) || 10;
            const rightFold = parseInt(p.get('fr')) || 10;
            const extension = parseInt(p.get('e')) || 5;

            return {
                width: width,
                depth: depth,
                layers: layers,
                layerThickness: thickness,
                extension: extension,
                totalHeight: totalHeight,
                topFold: topFold,
                bottomFold: bottomFold,
                leftFold: leftFold,
                rightFold: rightFold,
                layerHeights: layerHeights
            };
        }

        const params = parseParams();

        // 显示参数
        const display = document.getElementById('params-display');
        const outerW = params.width + params.leftFold + params.rightFold;
        const outerH = params.totalHeight + params.topFold + params.bottomFold;
        display.innerHTML = `
            <p class="red">外径: ${outerW} x ${outerH} mm</p>
            <p>内径: ${params.width} x ${params.totalHeight} mm</p>
            <p>深度: ${params.depth} mm</p>
            <p>外框延伸: ${params.extension} mm</p>
            <p>层数: ${params.layers} 层</p>
        `;

        const container = document.getElementById('three-container');
        ThreeViewer.init(container, params);
        document.getElementById('loading').style.display = 'none';
    </script>
</body>
</html>
