<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>壁龛定制</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>壁龛定制</h1>
        
        <section class="section params-section">
            <h2>尺寸参数</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>总高度 (mm)</label>
                    <input type="number" id="totalHeight" value="880" min="1">
                </div>
                <div class="form-group">
                    <label>宽度 (mm)</label>
                    <input type="number" id="width" value="260" min="1">
                </div>
                <div class="form-group">
                    <label>深度 (mm)</label>
                    <input type="number" id="depth" value="250" min="1">
                </div>
                <div class="form-group">
                    <label>层数</label>
                    <input type="number" id="layers" value="3" min="1">
                </div>
                <div class="form-group">
                    <label>层板厚度 (mm)</label>
                    <input type="number" id="layerThickness" value="10" min="1">
                </div>
                <div class="form-group full-width">
                    <label>折边模式</label>
                    <select id="foldMode">
                        <option value="uniform">四边统一</option>
                        <option value="separate">分开设置</option>
                    </select>
                </div>
                <div class="form-group fold-uniform">
                    <label>折边 (mm)</label>
                    <input type="number" id="foldUniform" value="10" min="0">
                </div>
                <div class="form-group fold-separate hidden">
                    <label>上折边 (mm)</label>
                    <input type="number" id="foldTop" value="10" min="0">
                </div>
                <div class="form-group fold-separate hidden">
                    <label>下折边 (mm)</label>
                    <input type="number" id="foldBottom" value="10" min="0">
                </div>
                <div class="form-group fold-separate hidden">
                    <label>左折边 (mm)</label>
                    <input type="number" id="foldLeft" value="10" min="0">
                </div>
                <div class="form-group fold-separate hidden">
                    <label>右折边 (mm)</label>
                    <input type="number" id="foldRight" value="10" min="0">
                </div>
                <div class="form-group">
                    <label>外框延伸 (mm)</label>
                    <input type="number" id="extension" value="5" min="0">
                </div>
            </div>
            
            <div id="layerHeightsContainer" class="layer-heights">
                <h3>每层高度</h3>
                <p class="hint">默认均分，可手动修改以单独调整每层高度</p>
                <div id="layerInputs" class="layer-inputs-grid"></div>
            </div>
            
            <button id="generateBtn" class="btn-primary">生成视图</button>
        </section>
        
        <section class="section views-section">
            <h2>工程视图</h2>
            <div class="views-wrapper">
                <canvas id="combinedView"></canvas>
                <canvas id="frontView" style="display:none"></canvas>
                <canvas id="sideView" style="display:none"></canvas>
            </div>
            <div id="qrcode-wrapper">
                <p>扫码查看3D模型</p>
                <div id="qrcode"></div>
            </div>
            <button id="exportBtn" class="btn-secondary">导出视图为图片</button>
        </section>
        
        <section class="section model-section">
            <h2>3D模型</h2>
            <div id="three-container"></div>
            <p class="hint">触摸旋转 · 双指缩放 · 单指平移</p>
        </section>
    </div>
    
    <script src="js/drawer.js"></script>
    <script src="js/three-viewer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
